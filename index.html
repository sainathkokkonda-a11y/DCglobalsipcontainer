<div class="global-sip-container">
  <div class="global-sip-card">
    <div class="global-sip-header">
      <h2>SIP &amp; Mutual Fund Calculator</h2>
      <p>Calculate your future wealth &amp; investment returns</p>
    </div>
    
    <div class="global-sip-body">
      <div class="input-group">
        <label>Monthly Investment Amount</label>
        <div class="input-flex-wrapper">
          <select class="currency-select" id="sipCurrencySymbol" onchange="calculateSIP()">
            <option value="$">$ (USD)</option>
            <option value="€">€ (EUR)</option>
            <option value="£">£ (GBP)</option>
            <option value="₹" selected>₹ (INR)</option>
            <option value="A$">A$ (AUD)</option>
            <option value="C$">C$ (CAD)</option>
            <option value="AED">AED</option>
          </select>
          <input class="global-input" id="monthlyInvestment" type="number" step="any" value="5000" oninput="calculateSIP()" />
        </div>
      </div>

      <div class="input-group">
        <label>Expected Annual Return Rate (%)</label>
        <input class="global-input" id="expectedReturnRate" type="number" step="any" value="12" oninput="calculateSIP()" />
      </div>

      <div class="input-group">
        <label>Investment Period (Years)</label>
        <input class="global-input" id="investmentYears" type="number" step="any" value="10" oninput="calculateSIP()" />
      </div>

      <button class="btn-calculate" onclick="calculateSIP()">Calculate Wealth</button>

      <div class="result-box">
        <div class="result-item highlight-total">
          <span class="result-label">Total Expected Value:</span>
          <span class="result-value" id="totalValue">0</span>
        </div>
        <div class="result-item">
          <span class="result-label">Invested Amount:</span>
          <span class="result-value" id="investedAmount">0</span>
        </div>
        <div class="result-item">
          <span class="result-label">Estimated Returns:</span>
          <span class="result-value" id="estReturns">0</span>
        </div>
      </div>
    </div>
  </div>
</div>
